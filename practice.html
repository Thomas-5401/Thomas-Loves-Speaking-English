<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日练习">
<title>每日练习 第二季</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1EC; --card:#FFFFFF; --line:#D6DED8; --line-strong:#B9C7BD;
  --ink:#17231D; --soft:#5A6B61; --green:#1F6B4F; --on-green:#FFFFFF;
  --stamp:#C8372D; --stamp-soft:#FBE9E6; --gold:#A87718; --gold-soft:#FBF1DC;
  --blue:#2F55C8; --blue-soft:#E6ECFB; --hi:#F6D44A; --shadow:rgba(23,35,29,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","SimSun",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1915; --card:#18241F; --line:#26352E; --line-strong:#37483F;
    --ink:#E6EEE9; --soft:#9DB0A5; --green:#4FBF8F; --on-green:#0F1915;
    --stamp:#F06A5E; --stamp-soft:#3A1F1C; --gold:#E2B547; --gold-soft:#33291A;
    --blue:#7C9BF7; --blue-soft:#1C2742; --hi:#E8C53A; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1915; --card:#18241F; --line:#26352E; --line-strong:#37483F;
  --ink:#E6EEE9; --soft:#9DB0A5; --green:#4FBF8F; --on-green:#0F1915;
  --stamp:#F06A5E; --stamp-soft:#3A1F1C; --gold:#E2B547; --gold-soft:#33291A;
  --blue:#7C9BF7; --blue-soft:#1C2742; --hi:#E8C53A; --shadow:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;width:100%}
textarea.code{min-height:80px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
label{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
p{margin:0} h1,h2,h3{margin:0}
[hidden]{display:none !important}
.app{max-width:560px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.app.playing{padding-bottom:40px}

/* 底部标签栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line-strong);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab-btn{padding:9px 0 8px;font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab-btn span{font-size:20px;line-height:1.2}
.tab-btn[aria-current="page"]{color:var(--green);font-weight:700}

/* 通用 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.date{color:var(--soft);font-size:15px}
.top h1{font-family:var(--serif);font-size:clamp(30px,8vw,40px);font-weight:600;line-height:1.1;margin-top:2px}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:14px}
.warn{background:var(--stamp-soft);border-left:4px solid var(--stamp);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:14px}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;border:1.5px solid var(--line-strong);background:var(--card)}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.wide{width:100%}
.link-btn{color:var(--soft);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.subhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.subhead h2{font-family:var(--serif);font-size:24px;font-weight:600}
.back{padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:14px;background:var(--card)}
.section{font-size:15px;font-weight:700;color:var(--soft);margin:20px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border-radius:8px;padding:10px 12px}
.stats dt{font-size:12px;color:var(--soft)}
.stats dd{margin:0;font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:grid;gap:10px;margin-top:16px}
.saved{text-align:center;font-size:12px;color:var(--soft);margin-top:14px}

/* 打卡卡片 */
.habit{background:var(--card);border-radius:12px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 1px 0 var(--line-strong),0 14px 28px -22px var(--shadow)}
.h-top{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.emoji{font-size:26px;line-height:1;flex:none;width:42px;height:42px;display:grid;place-items:center;background:var(--bg);border-radius:10px}
.h-name{font-size:18px;font-weight:700;line-height:1.3}
.h-target{font-size:14px;color:var(--soft)}
.h-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:14px 0 10px}
.day-big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:.9;font-variant-numeric:lining-nums tabular-nums}
.day-of{font-size:15px;color:var(--soft);margin-left:4px}
.h-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--soft);justify-content:flex-end;text-align:right}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--stamp)}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:8px;padding:9px 12px;font-size:14px;margin-bottom:8px}
.task b{font-weight:700}
.task.ok{color:var(--green)}
.step{font-size:14px;background:var(--blue-soft);border-radius:8px;padding:9px 12px;margin-bottom:10px}
.step b{color:var(--blue)}
.fill{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.fill .btn{margin-top:8px}
.stamp-btn{width:100%;background:var(--stamp);color:#fff;border-radius:8px;padding:14px 16px;font-size:18px;font-weight:700;letter-spacing:.04em}
.done-row{display:flex;align-items:center;gap:12px;padding:6px 0}
.mini-stamp{width:52px;height:52px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-weight:700;font-size:15px;transform:rotate(-12deg);flex:none;font-family:var(--serif)}
.mini-stamp.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.9) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.done-sub{font-size:13px;color:var(--soft)}
.next{font-size:14px;color:var(--soft);margin-top:10px}
.next b{color:var(--gold)}
.form-inline{background:var(--bg);border-radius:8px;padding:4px 12px 12px;margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{width:100%;border:2px dashed var(--line-strong);border-radius:12px;padding:14px;color:var(--soft);font-weight:700;margin-bottom:6px}

/* 集章卡 */
.card-sheet{background:var(--card);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--soft);position:relative}
.cell.stamped{border:2.5px solid var(--stamp);color:var(--stamp);font-weight:700;background:var(--stamp-soft)}
.cell.card{border:2.5px solid var(--gold);color:var(--gold);font-weight:700;background:var(--gold-soft)}
.cell.today{border:2.5px solid var(--green);color:var(--green);font-weight:700}
.cell.gift::after{content:"🎁";position:absolute;right:-4px;top:-6px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--soft);margin-top:10px}
.reward{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.reward .rd{font-family:var(--serif);font-weight:600;font-size:18px}
.reward.locked{opacity:.55}
.reward.open{border-left:4px solid var(--gold)}
.tag{font-size:12px;color:var(--soft)}
.hist{background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.hist span{color:var(--soft);margin-right:8px}

/* 闯关 */
.rank-name{font-family:var(--serif);font-weight:600;font-size:clamp(32px,9vw,46px);line-height:1.05;letter-spacing:-.01em}
.rank-sub{color:var(--soft);margin-top:6px}
.ladder{display:flex;gap:4px;margin:16px 0 4px}
.rung{flex:1;height:8px;border-radius:2px;background:var(--line-strong)}
.rung.done{background:var(--blue)}
.rung.cur{background:linear-gradient(to right,var(--blue) var(--p),var(--line-strong) var(--p))}
.s1{font-size:13px;color:var(--soft);margin-top:8px}
.quest{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;text-align:left;background:var(--blue);color:#fff;border-radius:12px;padding:18px 20px;margin:16px 0 20px;box-shadow:0 12px 26px -16px var(--shadow)}
.quest-title{font-size:20px;font-weight:700}
.quest-sub{font-size:14px;opacity:.9;grid-column:1}
.quest-go{grid-column:2;grid-row:1 / span 2;font-weight:700;font-size:17px;padding:8px 14px;border-radius:8px;background:rgba(255,255,255,.18)}
.menu{border-top:1px solid var(--line-strong)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line-strong)}
.row-name{font-weight:600;font-size:17px}
.row-meta{color:var(--soft);font-size:14px;text-align:right}
.playbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);font-size:16px;flex:none}
.progress{flex:1;height:10px;background:var(--line-strong);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s ease}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin:0 2px 8px}
.qcard{position:relative;background-color:var(--card);border-radius:8px;padding:0 20px 18px;box-shadow:0 1px 0 var(--line-strong),0 16px 30px -22px var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-position:0 48px;background-repeat:no-repeat;background-size:100% calc(100% - 60px)}
.qcard::before{content:"";position:absolute;left:0;right:0;top:46px;height:2px;background:var(--stamp);opacity:.75}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;height:46px;font-size:14px;color:var(--soft)}
.qhead b{color:var(--ink)}
.qbody{padding-top:12px;line-height:32px;min-height:80px}
.situ{font-size:17px}
.said{font-family:var(--serif);font-size:20px;color:var(--soft);text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:2px}
.direct{font-family:var(--serif);font-size:21px}
.lead-chip{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:0 8px;line-height:28px;font-family:var(--serif);font-size:18px}
.qcard.enter{animation:enter .26s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.answer-box{margin-top:12px}
.answer-box textarea{min-height:84px;font-family:var(--serif);font-size:19px;line-height:1.45;resize:vertical;background:var(--card)}
.ans-tools{display:flex;gap:10px;margin-top:10px}
.ans-tools .btn{flex:1}
.timer-ring{font-family:var(--serif);font-size:56px;font-weight:600;text-align:center;line-height:1.1;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.rec{display:flex;gap:10px;justify-content:center;margin:6px 0}
.feedback{margin-top:14px;background:var(--card);border-radius:8px;border-left:5px solid var(--green);padding:14px 16px 16px;animation:rise .22s ease-out}
.feedback.bad{border-left-color:var(--stamp)}
.feedback.mid{border-left-color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{font-weight:700;font-size:17px;margin-bottom:6px}
.feedback.good .verdict{color:var(--green)}
.feedback.mid .verdict{color:var(--gold)}
.feedback.bad .verdict{color:var(--stamp)}
.fb-label{font-size:13px;color:var(--soft);margin-top:8px}
.fb-right{font-family:var(--serif);font-size:20px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.fb-mine{font-family:var(--serif);font-size:17px;line-height:1.5}
.fb-mine del{color:var(--stamp);text-decoration-thickness:2px}
.fb-diff ins{text-decoration:none;background:var(--hi);color:#17231D;border-radius:3px;padding:0 2px}
.fb-note{font-size:14px;color:var(--soft);margin-top:8px}
.speak-btn{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong);background:var(--card);font-size:15px;line-height:1}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate .btn{padding:11px 4px;font-size:15px}
.world{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:13px;margin-bottom:10px}
.w-num{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--blue);text-align:center}
.w-name{display:block;font-weight:700}
.w-tip{display:block;font-size:13px;color:var(--soft)}
.w-bar{display:block;height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.w-bar i{display:block;height:100%;background:var(--green)}
.w-meta{font-size:13px;color:var(--soft);text-align:right;line-height:1.4}
.entry{background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.entry .said{font-size:16px}
.entry .fb-right{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip-btn{padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.result-head{text-align:center;padding:18px 0 6px}
.result-head h2{font-family:var(--serif);font-size:34px;font-weight:600;margin-bottom:6px}
.rankup{background:var(--hi);color:#17231D;border-radius:8px;padding:12px 14px;font-weight:700;text-align:center;margin-bottom:14px}

/* 设置、表单、帮助 */
.set{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.set h3{font-size:16px;margin-bottom:6px}
.set p{font-size:14px;color:var(--soft);margin-bottom:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.form{background:var(--card);border-radius:10px;padding:6px 16px 16px}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px}
.emo-pick button{width:42px;height:42px;border-radius:8px;border:1.5px solid var(--line-strong);font-size:22px;background:var(--bg)}
.emo-pick button[aria-pressed="true"]{border-color:var(--green);background:var(--card)}
.rw{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.rw span{font-family:var(--serif);font-weight:600}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px}
.check input{width:auto}
.help h3{font-size:17px;margin:20px 0 6px}
.help p,.help li{font-size:15px}
.help ol{padding-left:22px;margin:6px 0}
.help li{margin-bottom:6px}
.book-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.book-row:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:20px;z-index:30}
.modal-box{background:var(--card);border-radius:14px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;animation:rise .3s ease-out}
.big-stamp{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--serif);font-size:28px;font-weight:700;transform:rotate(-10deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.modal-box h3{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.modal-box p{color:var(--soft);margin-bottom:6px}
.gift{background:var(--gold-soft);border-radius:8px;padding:10px;margin:10px 0;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app" id="app">
  <section id="v-today"></section>
  <section id="v-quest" hidden></section>
  <section id="v-play" hidden></section>
  <section id="v-stats" hidden></section>
  <section id="v-settings" hidden></section>
  <section id="v-sub" hidden></section>
</div>
<nav class="tabbar" id="tabbar" aria-label="主导航"><div class="tabbar-in">
  <button class="tab-btn" data-act="tab" data-v="today"><span>📮</span>今天</button>
  <button class="tab-btn" data-act="tab" data-v="quest"><span>🎯</span>闯关</button>
  <button class="tab-btn" data-act="tab" data-v="stats"><span>📈</span>统计</button>
  <button class="tab-btn" data-act="tab" data-v="settings"><span>⚙</span>设置</button>
</div></nav>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
// 第二季题库：来自最近三场面试。字段：c 类别, z 场景, w 原话, r 标准答案, a 其他可接受答案, k 必含关键词（| 表示任选其一）, nk 不能出现的错误说法, n 要点, s1 是否第一季遗留
var CATS2 = [
  {id:1, name:"间接问句", tip:"what / why / how 后面用陈述语序，不加 do / did"},
  {id:2, name:"问句骨架", tip:"补齐助动词和主语，单复数统一"},
  {id:3, name:"时态", tip:"讲已经发生的事用过去式"},
  {id:4, name:"动词搭配", tip:"consider doing、explain sth to sb、mention 不加 about"},
  {id:5, name:"词形与单复数", tip:"stressed / stressful、one of the + 复数"},
  {id:6, name:"中式表达", tip:"How did you feel、take steps、Tell me about a time"},
  {id:7, name:"开场与测试说明", tip:"这些句子每场都说，必须零错误"},
  {id:8, name:"问句变形", tip:"把直接问句改成间接问句"}
];
var ITEMS2 = [

    evaluate(h); save(); toast("已保存"); if (editing.isNew) renderToday(); else renderDetail(h.id);
  },
  got: function(b){ var h = byId(cur), r = h.rewards[+b.getAttribute("data-k")]; r.got = !r.got; save(); renderDetail(cur); },
  newRound: function(){ var h = byId(cur); h.history.push({round:h.round, days:h.days, end:h.completed, fund:fundOf(h)}); h.round++; h.start = today(); h.completed = null; h.unlocked = {}; h.cardKeys = {}; h.cards = Math.max(h.cards, 1); h.rewards.forEach(function(r){ r.got = false; }); save(); renderDetail(h.id); },
  remove: function(){ var h = byId(cur); if (h && confirm("确定删除“" + h.name + "”和它的全部记录吗？")){ S.habits = S.habits.filter(function(x){ return x !== h; }); save(); renderToday(); } },
  ics: function(){ var h = byId(cur); download("打卡提醒-" + h.name + ".ics", "text/calendar;charset=utf-8", icsText(h)); toast("已生成日历文件，打开后选“添加”"); },
  quest: function(){ startRound("quest", buildQuest(12), "今日任务"); },
  speakRound: function(){ var p = buildQuest(10).filter(function(it){ return it.c !== 8; }); startRound("speak", p, "只练开口", true); },
  transRound: function(){ startRound("trans", shuffle(ITEMS2.filter(function(it){ return it.c === 8 || it.c === 1; })).sort(function(a,b){ return qst(a.id).b - qst(b.id).b; }).slice(0, 10), "问句变形专练"); },
  s1Round: function(){ startRound("s1", shuffle(ITEMS2.filter(function(it){ return it.s1; })), "第一季遗留"); },
  worlds: renderWorlds,
  world: function(b){ var c = +b.getAttribute("data-c"); startRound("world", shuffle(ITEMS2.filter(function(it){ return it.c === c; })).sort(function(a,b){ return qst(a.id).b - qst(b.id).b; }).slice(0, 10), catName(c)); },
  book: renderBook,
  bookRound: function(){ startRound("book", shuffle(ITEMS2.filter(function(it){ var s = S.q.items[it.id]; return s && s.bad > 0 && s.b < 3; })).slice(0, 12), "错题本"); },
  retry: function(){ var m = R && R.lastMissed; if (m && m.length) startRound("retry", shuffle(m), "再练一次"); },
  quit: function(){ clearInterval(spTimer); R = null; renderQuest(); },
  submit: submitAns,
  hint: function(){ var it = R.items[R.i]; R.hint = true; $("#hintText").textContent = "提示：" + it.n + "。开头是 " + it.r.split(" ").slice(0, 2).join(" ") + " …（用了提示，这题 XP 减半）"; },
  override: function(){ var it = R.items[R.i], s = qst(it.id); s.bad = Math.max(0, s.bad - 1); S.q.items[it.id] = s; gradeQ(it, true); R.wrong--; R.right++; R.missed = R.missed.filter(function(x){ return x !== it; }); var g = xpFor(R.types[R.i], 1, 0.5); addXP(g); save(); toast("已算作答对，+" + g + " XP"); var o = document.querySelector('[data-act="override"]'); if (o) o.remove(); },
  next: function(){ R.i++; renderQ(); },
  spStart: spStart, spDone: spDone,
  rate: function(b){ rateSpeak(+b.getAttribute("data-v")); },
  playRec: function(){ if (recUrl) new Audio(recUrl).play().catch(function(){}); },
  say: function(b){ var it = BYID[b.getAttribute("data-id")]; if (it) speak(it.r); },
  help: renderHelp,
  setMode: function(b){ S.settings.mode = b.getAttribute("data-v"); save(); renderSettings(); },
  setRec: function(b){ S.settings.rec = b.getAttribute("data-v") === "1"; save(); renderSettings(); },
  setVoice: function(b){ S.settings.voice = b.getAttribute("data-v") === "1"; save(); renderSettings(); },
  setSound: function(b){ S.settings.sound = b.getAttribute("data-v") === "1"; save(); renderSettings(); },
  setTheme: function(b){ S.settings.theme = b.getAttribute("data-v"); save(); applyTheme(); renderSettings(); },
  copy: function(){ var box = $("#exp"); function fb(){ box.focus(); box.select(); try { document.execCommand("copy"); toast("已复制"); } catch(e){ toast("请长按文本框手动复制"); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(function(){ toast("已复制"); }, fb); else fb(); },
  "import": function(){ var v = $("#imp").value.trim(); if (!v) return;
    try { var o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!o || !Array.isArray(o.habits)) throw 0; S = fixState(o); save(); applyTheme(); toast("记录已恢复"); renderToday(); } catch(e){ toast("备份码无法识别"); } },
  csv: function(){ download("打卡记录.csv", "text/csv;charset=utf-8", csvText()); },
  wipe: function(){ if (confirm("确定清空全部打卡和闯关记录吗？这一步无法撤销。")){ S = freshState(null); save(); applyTheme(); renderToday(); } }
};
document.addEventListener("click", function(e){ var b = e.target.closest("[data-act]"); if (!b || b.disabled) return; var f = ACT[b.getAttribute("data-act")]; if (f) f(b, e); });
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey && e.target && e.target.id === "ans"){ e.preventDefault(); if (R && !R.answered) submitAns(); else if (R) ACT.next(); }
  if (e.key === "Escape" && !$("#modal").hidden) ACT.closeModal();
});
document.addEventListener("change", function(e){ if (e.target && e.target.id === "f-days") $("#f-rewards").innerHTML = rewardRows(rewardsFor(+e.target.value, readRewards())); });
document.addEventListener("visibilitychange", function(){ if (document.hidden) save(); else if (!$("#v-today").hidden) renderToday(); });
window.addEventListener("pagehide", save);

/* ---------- 启动 ---------- */
applyTheme();
S.habits.forEach(function(h){ evaluate(h); });
save();
renderToday();
var LOCAL_T = (LOCAL_AT_START && LOCAL_AT_START.savedAt) || 0;
idbGet(KEY).then(function(str){
  IDB_OK = true; var adopted = false;
  if (str){ try { var o = JSON.parse(str); if (o && (!LOCAL_AT_START || (o.savedAt || 0) > LOCAL_T)){ S = fixState(o); adopted = true; } } catch(e){} }
  var after = function(){ idbReady = true; save(); if (adopted){ applyTheme(); renderTab(curTab); toast("已从数据库备份恢复记录"); } };
  if (!adopted && !LOCAL_AT_START && !S.migrated){
    idbGet(OLD_CI).then(function(os){ if (os){ try { var old = JSON.parse(os); if (old && old.habits){ S.habits = migrateHabits(old.habits); S.migrated = true; adopted = true; } } catch(e){} } after(); }, after);
  } else after();
}, function(){ IDB_OK = false; });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function(g){ PERSISTED = g; }, function(){}); } catch(e){}
if (/^https?:$/.test(location.protocol)){
  try { var lm = document.createElement("link"); lm.rel = "manifest"; lm.href = "manifest-practice.webmanifest"; document.head.appendChild(lm);
    var li = document.createElement("link"); li.rel = "apple-touch-icon"; li.href = "icon-checkin-180.png"; document.head.appendChild(li);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){}); } catch(e){}
}
})();
</script>
</body>
