<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thomas 的每日练习</title>
<link rel="icon" href="icon-checkin-192.png"><link rel="apple-touch-icon" href="icon-checkin-180.png">
<style>
:root{color-scheme:light;--bg:#E8EEEA;--card:#FFFFFF;--ink:#16261F;--soft:#56685E;--line:#B7C6BC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1A16;--card:#18251F;--ink:#E6EEE9;--soft:#9DB0A5;--line:#37493F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1A16;--card:#18251F;--ink:#E6EEE9;--soft:#9DB0A5;--line:#37493F}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:28px 16px 48px}
h1{font-family:"Iowan Old Style",Palatino,Georgia,"Songti SC",serif;font-size:34px;font-weight:600;margin:0 0 6px}
p{margin:0 0 18px;color:var(--soft)}
a.app{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;color:inherit;text-decoration:none;border:1px solid var(--line)}
a.app img{width:56px;height:56px;border-radius:12px}
a.app b{display:block;font-size:18px}
a.app span{color:var(--soft);font-size:14px}
.tip{font-size:14px;margin-top:18px}
</style></head><body><main>
<h1>每日练习</h1>
<p>先打开打卡程序看今天的任务，练完回来盖章。</p>
<a class="app" href="practice.html"><img src="icon-checkin-192.png" alt=""><span><b>每日练习 第二季</b><span>打卡和闯关在一起，以后用这个</span></span></a>
<p class="tip">下面是第一版，记录已经自动搬进第二季，可以不再使用。</p>
<a class="app" href="checkin.html"><img src="icon-checkin-192.png" alt=""><span><b>60 天打卡</b><span>英语、读书、学习，每天盖一个章</span></span></a>
<a class="app" href="quest.html"><img src="icon-quest-192.png" alt=""><span><b>面试英语闯关</b><span>每日任务、顽固 20 句、4/3/2 脚本练习</span></span></a>
<p class="tip">建议分别打开两个程序，各自“添加到桌面”，手机上就有两个独立图标。记录只存在你自己的手机里。</p>
</main>
<script>if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){});</script>
</body></html>
