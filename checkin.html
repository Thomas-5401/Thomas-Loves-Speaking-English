<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="60天打卡">
<title>60 天打卡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>">
<style>
:root{
  color-scheme: light;
  --bg:#E8EEEA; --card:#FFFFFF; --line:#D3DDD6; --line-strong:#B7C6BC;
  --ink:#16261F; --soft:#56685E; --green:#1F6B4F; --on-green:#FFFFFF;
  --stamp:#C8372D; --stamp-soft:#FBE9E6; --gold:#B8872A; --gold-soft:#FBF1DC; --shadow:rgba(22,38,31,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","SimSun",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1A16; --card:#18251F; --line:#26362E; --line-strong:#37493F;
    --ink:#E6EEE9; --soft:#9DB0A5; --green:#4FBF8F; --on-green:#0F1A16;
    --stamp:#F06A5E; --stamp-soft:#3A1F1C; --gold:#E2B547; --gold-soft:#33291A; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1A16; --card:#18251F; --line:#26362E; --line-strong:#37493F;
  --ink:#E6EEE9; --soft:#9DB0A5; --green:#4FBF8F; --on-green:#0F1A16;
  --stamp:#F06A5E; --stamp-soft:#3A1F1C; --gold:#E2B547; --gold-soft:#33291A; --shadow:rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
label{display:block;font-size:14px;color:var(--soft);margin:12px 0 4px}
p{margin:0}
h1,h2,h3{margin:0}
[hidden]{display:none !important}
.app{max-width:560px;margin:0 auto;padding:18px 16px 56px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.date{color:var(--soft);font-size:15px}
.top h1{font-family:var(--serif);font-size:clamp(30px,8vw,40px);font-weight:600;line-height:1.1;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);font-size:18px;flex:none}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:14px}
.warn{background:var(--stamp-soft);border-left:4px solid var(--stamp);padding:10px 12px;border-radius:6px;font-size:14px;margin-bottom:14px}

.habit{background:var(--card);border-radius:10px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:0 1px 0 var(--line-strong),0 14px 28px -22px var(--shadow);position:relative;overflow:hidden}
.h-top{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left}
.emoji{font-size:28px;line-height:1;flex:none;width:40px;height:40px;display:grid;place-items:center;background:var(--bg);border-radius:8px}
.h-name{font-size:18px;font-weight:700;line-height:1.3}
.h-target{font-size:14px;color:var(--soft)}
.h-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:14px 0 10px}
.day-big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:.9;font-variant-numeric:lining-nums tabular-nums}
.day-of{font-size:15px;color:var(--soft);margin-left:4px}
.h-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft);justify-content:flex-end;text-align:right}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--stamp)}
.linked{font-size:14px;color:var(--green);font-weight:600;margin-bottom:8px}
.fill{background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.fill .btn{margin-top:8px}
.checkin{display:flex;gap:10px;align-items:center}
.stamp-btn{flex:1;background:var(--stamp);color:#fff;border-radius:8px;padding:14px 16px;font-size:18px;font-weight:700;letter-spacing:.04em}
.done-row{flex:1;display:flex;align-items:center;gap:10px;padding:8px 0}
.mini-stamp{width:52px;height:52px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-weight:700;font-size:14px;transform:rotate(-12deg);flex:none}
.mini-stamp.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.9) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
.done-text{font-weight:700}
.done-sub{font-size:13px;color:var(--soft)}
.link-btn{color:var(--soft);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.next{font-size:14px;color:var(--soft);margin-top:10px}
.next b{color:var(--gold)}
.note-input{display:flex;gap:8px;margin-top:10px}
.note-input input{flex:1}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;border:1.5px solid var(--line-strong);background:var(--card)}
.btn.primary{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.danger{color:var(--stamp);border-color:var(--stamp)}
.btn.wide{width:100%}
.add{width:100%;border:2px dashed var(--line-strong);border-radius:10px;padding:14px;color:var(--soft);font-weight:700;margin-bottom:18px}
.foot{display:flex;gap:18px;justify-content:center;font-size:14px}
.saved{text-align:center;font-size:12px;color:var(--soft);margin-top:10px}

.subhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.subhead h2{font-family:var(--serif);font-size:24px;font-weight:600}
.back{padding:6px 10px;border:1px solid var(--line-strong);border-radius:6px;font-size:14px;background:var(--card)}
.pledge{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--soft);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:var(--card);border-radius:8px;padding:10px 12px}
.stats dt{font-size:12px;color:var(--soft)}
.stats dd{margin:0;font-family:var(--serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.section{font-size:15px;font-weight:700;color:var(--soft);margin:18px 0 10px}

/* 集章卡 */
.card-sheet{background:var(--card);border-radius:10px;padding:14px;box-shadow:0 1px 0 var(--line-strong)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line-strong);display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--soft);position:relative}
.cell.stamped{border:2.5px solid var(--stamp);color:var(--stamp);font-weight:700;background:var(--stamp-soft)}
.cell.card{border:2.5px solid var(--gold);color:var(--gold);font-weight:700;background:var(--gold-soft)}
.cell.today{border:2.5px solid var(--green);color:var(--green);font-weight:700}
.cell.gift::after{content:"🎁";position:absolute;right:-4px;top:-6px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--soft);margin-top:10px}

.reward{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.reward .rd{font-family:var(--serif);font-weight:600;font-size:18px}
.reward.locked{opacity:.55}
.reward.open{border-left:4px solid var(--gold)}
.reward .tag{font-size:12px;color:var(--soft)}
.hist{background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px}
.hist div{padding:6px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.hist span{color:var(--soft);margin-right:8px}
.actions{display:grid;gap:10px;margin-top:16px}

.form{background:var(--card);border-radius:10px;padding:6px 16px 16px}
.emo-pick{display:flex;flex-wrap:wrap;gap:6px}
.emo-pick button{width:42px;height:42px;border-radius:8px;border:1.5px solid var(--line-strong);font-size:22px;background:var(--bg)}
.emo-pick button[aria-pressed="true"]{border-color:var(--green);background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.rw span{font-family:var(--serif);font-weight:600}
.check{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px}
.check input{width:auto}
.tpls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tpl{padding:8px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.set{background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.set h3{font-size:16px;margin-bottom:6px}
.set p{font-size:14px;color:var(--soft);margin-bottom:10px}

.help h3{font-size:17px;margin:20px 0 6px}
.help p,.help li{font-size:15px}
.help ol{padding-left:22px;margin:6px 0}
.help li{margin-bottom:6px}
.help .tip{font-size:14px;color:var(--soft)}

.modal{position:fixed;inset:0;background:rgba(10,20,16,.55);display:grid;place-items:center;padding:20px;z-index:30}
.modal-box{background:var(--card);border-radius:14px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;animation:rise .3s ease-out}
.modal-box .big-stamp{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-family:var(--serif);font-size:30px;font-weight:700;transform:rotate(-10deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.modal-box h3{font-family:var(--serif);font-size:24px;margin-bottom:8px}
.modal-box p{color:var(--soft);margin-bottom:6px}
.modal-box .gift{background:var(--gold-soft);border-radius:8px;padding:10px;margin:10px 0;color:var(--ink);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <section id="v-home"></section>
  <section id="v-detail" hidden></section>
  <section id="v-edit" hidden></section>
  <section id="v-settings" hidden></section>
  <section id="v-help" hidden></section>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var KEY = "daily-checkin-v1", GAME_KEY = "thomas-interview-english-v1";
var MILESTONE_TEXT = {3:"一杯喜欢的咖啡或奶茶",7:"一份喜欢的甜点",14:"看一场电影",21:"买一本想读的书",30:"一顿好好吃的大餐",45:"一件提升效率的小装备",60:"一直想买的东西",75:"一份你自己定的奖励",90:"一份你自己定的奖励"};
var TEMPLATES = [
  {emoji:"🗣", name:"英语面试练习", target:"闯关每日任务 + 出声读手册 5 分钟", link:"quest", remind:"21:00"},
  {emoji:"📖", name:"读书", target:"读 20 页或 30 分钟，写一句收获", link:"", remind:"22:00"},
  {emoji:"🧠", name:"学习新技能", target:"学习 30 分钟", link:"", remind:"20:00"},
  {emoji:"🏃", name:"运动", target:"运动 20 分钟", link:"", remind:"07:30"},
  {emoji:"✍️", name:"", target:"", link:"", remind:"21:00"}
];
var EMOJIS = ["🗣","📖","🧠","🏃","✍️","🎧","💼","🧘","🌅","💡","🎹","🥗"];
var WEEK = ["日","一","二","三","四","五","六"];

/* ---------- 工具 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function dayNum(d){ d = d || new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset()*60000) / 86400000); }
function dayDate(n){ var u = new Date(n * 86400000); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
function fmtDay(n, withWeek){ var d = dayDate(n); return (d.getMonth()+1) + "月" + d.getDate() + "日" + (withWeek ? " 星期" + WEEK[d.getDay()] : ""); }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function today(){ return dayNum(); }
function toast(msg){ var t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ---------- 存储 ---------- */
var STORAGE_OK = (function(){ try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; } catch(e){ return false; } })();
var mem = null;
function load(){ try { var s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch(e){} return mem; }
function save(){ persistNow(); }
function rewardsFor(days, old){
  var ds = [3,7,14,21,30,45,60,75,90].filter(function(d){ return d < days; }).concat([days]);
  return ds.map(function(d){
    var prev = (old || []).filter(function(r){ return r.d === d; })[0];
    var t = prev ? prev.t : (d === days ? "大奖：" + (MILESTONE_TEXT[60]) + "，用奖励基金支付" : MILESTONE_TEXT[d]);
    return {d:d, t:t, got: prev ? !!prev.got : false};
  });
}
function newHabit(tpl){
  return {id:"h" + Date.now().toString(36) + Math.floor(Math.random()*1e4), name:tpl.name, emoji:tpl.emoji, target:tpl.target,
    days:60, start:today(), fund:10, unit:"元", link:tpl.link || "", remind:tpl.remind || "21:00",
    pledge:"我会每天完成，绝不连续漏两天。", rewards:rewardsFor(60), log:{}, cards:1, cardKeys:{}, unlocked:{}, completed:null, round:1, history:[]};
}
function fresh(){ return {v:1, created:today(), welcome:true, habits:[newHabit(TEMPLATES[0]), newHabit(TEMPLATES[1])], settings:{theme:"auto", sound:true}}; }
var LOCAL_AT_START = load();
var S = LOCAL_AT_START || fresh();
S.settings = S.settings || {theme:"auto", sound:true};
if (!load()) save();

/* ---------- 双重保存：localStorage + IndexedDB ---------- */
var IDB_NAME = "practice-store", IDB_STORE = "kv", idbP = null, idbReady = false, IDB_OK = null, PERSISTED = null;
function idb(){
  if (!idbP) idbP = new Promise(function(res, rej){
    try { var r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(IDB_STORE); };
      r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); };
    } catch(e){ rej(e); }
  });
  return idbP;
}
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res, rej){ var q = db.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(k); q.onsuccess = function(){ res(q.result); }; q.onerror = function(){ rej(q.error); }; }); }); }
function idbSet(k, v){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction(IDB_STORE, "readwrite", {durability:"strict"}); tx.objectStore(IDB_STORE).put(v, k); tx.oncomplete = function(){ res(true); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
function persistNow(){
  S.savedAt = Date.now();
  var str = JSON.stringify(S);
  mem = JSON.parse(str);
  try { localStorage.setItem(KEY, str); } catch(e){}
  if (idbReady) idbSet(KEY, str).then(function(){ IDB_OK = true; }, function(){ IDB_OK = false; });
}
function syncFromIdb(adopt, done){
  var localT = (LOCAL_AT_START && LOCAL_AT_START.savedAt) || 0;
  idbGet(KEY).then(function(str){
    IDB_OK = true; var adopted = false;
    if (str){ try { var o = JSON.parse(str); if (o && (!LOCAL_AT_START || (o.savedAt || 0) > localT)){ adopt(o); adopted = true; } } catch(e){} }
    idbReady = true; persistNow(); done(adopted);
  }, function(){ IDB_OK = false; done(false); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function(g){ PERSISTED = g; }, function(){}); } catch(e){}
  window.addEventListener("pagehide", persistNow);
  document.addEventListener("visibilitychange", function(){ if (document.hidden) persistNow(); });
}
function savedText(){
  if (!S.savedAt) return "还没有保存过";
  var d = new Date(S.savedAt), now = new Date(), p2 = function(n){ return (n < 10 ? "0" : "") + n; };
  var same = d.toDateString() === now.toDateString();
  return (same ? "今天 " : (d.getMonth() + 1) + "月" + d.getDate() + "日 ") + p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
}
function browserName(){
  var ua = navigator.userAgent || "";
  if (/MicroMessenger/i.test(ua)) return "微信内置浏览器（可能不保存记录，请改用华为浏览器打开）";
  if (/HuaweiBrowser/i.test(ua)) return "华为浏览器";
  if (/HarmonyOS|ArkWeb/i.test(ua)) return "鸿蒙系统浏览器";
  if (/Chrome/i.test(ua)) return "Chrome 内核浏览器";
  if (/Safari/i.test(ua)) return "Safari";
  return "其他浏览器";
}
function diagHtml(){
  var ok = function(v){ return v === true ? "正常" : (v === false ? "不可用" : "检测中"); };
  return '<div class="set"><h3>存储诊断</h3><p>记录同时保存在两个地方，任何一处还在都能恢复。</p>' +
    '<p>上次保存：' + savedText() + '<br>本地存储：' + ok(STORAGE_OK) + '<br>数据库备份：' + ok(IDB_OK) +
    '<br>持久存储：' + (PERSISTED === true ? "已开启" : (PERSISTED === false ? "浏览器未开启（不影响正常保存）" : "检测中")) +
    '<br>浏览器：' + browserName() + '</p></div>';
}

/* ---------- 规则 ---------- */
function logged(h, n){ return !!h.log[n]; }
function streakInfo(h){
  var t = today(), end = logged(h, t) ? t : t - 1, n = end, len = 0;
  while (n >= h.start && logged(h, n)){ len++; n--; }
  return {len:len, start: len ? n + 1 : (logged(h, t) ? t : t), end:end};
}
function progress(h){ return Math.min(streakInfo(h).len, h.days); }
function bestStreak(h){
  var ds = Object.keys(h.log).map(Number).sort(function(a,b){ return a - b; }), best = 0, run = 0, prev = null;
  ds.forEach(function(d){ run = (prev !== null && d === prev + 1) ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  return best;
}
function totalDays(h){ return Object.keys(h.log).length; }
function fundOf(h){ var c = 0; for (var k in h.log){ if (+k >= h.start && h.log[k].t === "done") c++; } return c * (+h.fund || 0); }
function missingFillable(h){
  // 昨天、前天漏打卡，而且缺口前面有连续记录时，补签才有意义
  var t = today(), out = [];
  [t - 2, t - 1].forEach(function(n){ if (n >= h.start && !logged(h, n)) out.push(n); });
  if (!out.length || !logged(h, out[0] - 1)) return [];
  return out;
}
function runBefore(h, n){ var len = 0; n--; while (n >= h.start && logged(h, n)){ len++; n--; } return len; }
function evaluate(h){
  var events = [], info = streakInfo(h), p = Math.min(info.len, h.days);
  h.rewards.forEach(function(r){
    if (r.d <= p && !h.unlocked[r.d]){ h.unlocked[r.d] = today(); events.push({type:"reward", d:r.d, t:r.t, final: r.d === h.days}); }
  });
  for (var k = 7; k <= p; k += 7){
    var key = info.start + ":" + k;
    if (!h.cardKeys[key]){ h.cardKeys[key] = 1; if (h.cards < 3){ h.cards++; events.push({type:"card"}); } }
  }
  if (p >= h.days && !h.completed){ h.completed = today(); events.push({type:"complete"}); }
  return events;
}

var actx = null;
function chime(big){
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (big ? [523, 659, 784, 1047] : [440, 660]).forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.12;
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.32);
    });
  } catch(e){}
}

}

  html += '<h3>记录不见了怎么办</h3><ol><li>先看是不是在“无痕模式”里打开的。无痕模式关掉页面就会清空，要用普通模式打开。</li><li>确认是用华为浏览器打开的，不是在微信里点链接打开的。</li><li>到浏览器设置里看有没有“退出时清除浏览数据 / Cookie / 网站数据”一类的选项，有的话关掉。手机管家的自动清理也可能清掉网站数据，可以把浏览器加入白名单。</li><li>打完卡后等页面底部的“上次保存”时间更新了，再关闭浏览器。</li><li>万一真丢了：在“设置与备份”里粘贴之前复制的备份码就能恢复。</li></ol>';
  html += '<h3>每天提醒</h3><p>在项目页点“添加每日提醒到手机日历”，会下载一个日历文件，打开后选“添加”，就会在每天设定的时间提醒你，持续整个挑战。如果手机日历打不开这个文件，就用手机自带的闹钟设一个每天重复的闹钟，标签写“打卡”。</p>';
  html += '<h3>互相监督</h3><p>在项目页点“生成进度图”，把图片发给朋友、家人或同事，每周发一次。有人知道你在坚持，会更难放弃。</p>';
  html += '<h3>和闯关网页联动</h3><p>如果闯关网页和打卡程序在同一个网址目录下（比如都放在 GitHub Pages 的同一个仓库里），完成闯关的每日任务后，打卡程序会提示你“可以打卡了”。</p>';
  html += '</div>';
  $("#v-help").innerHTML = html;
  show("help");
}

/* ---------- 弹窗 ---------- */
function celebrate(h, events){
  if (!events.length) return;
  var big = events.some(function(e){ return e.type === "complete"; });
  var html = '<div class="modal-box" role="dialog" aria-modal="true">';
  var p = progress(h);
  html += '<div class="big-stamp">' + p + ' 天</div>';
  if (big) html += '<h3>挑战完成！</h3><p>连续 ' + h.days + ' 天，你做到了。</p>';
  else html += '<h3>连续 ' + p + ' 天</h3>';
  var nCards = 0;
  events.forEach(function(e){
    if (e.type === "reward") html += '<div class="gift">🎁 解锁奖励：' + esc(e.t) + '</div>';
    if (e.type === "card") nCards++;
  });
  if (nCards) html += '<p>🎫 获得 ' + nCards + ' 张补签卡，现在有 ' + h.cards + ' 张</p>';
  if (big && +h.fund) html += '<p>奖励基金：' + fundOf(h) + ' ' + esc(h.unit) + '，去兑现吧。</p>';
  html += '<button class="btn primary wide" data-act="closeModal" style="margin-top:12px">' + (big ? '太好了' : '继续加油') + '</button></div>';
  var m = $("#modal"); m.innerHTML = html; m.hidden = false;
  chime(true);
  var b = m.querySelector("button"); if (b) b.focus();
}

/* ---------- 文件导出 ---------- */
function download(name, mime, content){
  try {
    var blob = content instanceof Blob ? content : new Blob([content], {type:mime});
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  } catch(e){ toast("这个浏览器不支持下载文件"); }
}
function icsText(h){
  var t = today(), parts = (h.remind || "21:00").split(":"), hh = +parts[0], mm = +parts[1];
  var now = new Date(), startDay = (now.getHours()*60 + now.getMinutes() < hh*60 + mm) ? t : t + 1;
  var d = dayDate(startDay), ds = d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
  var endM = hh*60 + mm + 15, eh = Math.floor(endM/60) % 24, em = endM % 60;
  var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  var left = Math.max(1, h.days - progress(h));
  var esc2 = function(s){ return String(s).replace(/\\/g,"\\\\").replace(/[,;]/g, function(c){ return "\\" + c; }); };
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//daily-checkin//CN","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    "UID:" + h.id + "-" + startDay + "@daily-checkin", "DTSTAMP:" + stamp,
    "DTSTART:" + ds + "T" + pad(hh) + pad(mm) + "00", "DTEND:" + ds + "T" + pad(eh) + pad(em) + "00",
    "RRULE:FREQ=DAILY;COUNT=" + left, "SUMMARY:" + esc2("打卡：" + h.name), "DESCRIPTION:" + esc2(h.target + "。打开 60 天打卡程序盖个章。"),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + esc2("打卡：" + h.name),"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function shareImage(h){
  var W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  var x = c.getContext("2d"), info = streakInfo(h), p = Math.min(info.len, h.days), t = today();
  var sans = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif', serif = 'Georgia,"Songti SC",serif';
  x.fillStyle = "#E8EEEA"; x.fillRect(0, 0, W, H);
  x.fillStyle = "#FFFFFF"; roundRect(x, 60, 60, W - 120, H - 120, 36); x.fill();
  x.fillStyle = "#56685E"; x.font = "36px " + sans; x.fillText(fmtDay(t, true), 120, 160);
  x.fillStyle = "#16261F"; x.font = "bold 64px " + sans; x.fillText((h.emoji || "") + " " + h.name, 120, 250);
  x.font = "bold 150px " + serif; x.fillStyle = "#C8372D"; x.fillText(String(p), 120, 420);
  var w = x.measureText(String(p)).width; x.font = "48px " + sans; x.fillStyle = "#56685E"; x.fillText("/ " + h.days + " 天", 140 + w, 420);
  x.font = "34px " + sans; x.fillText("最长连续 " + bestStreak(h) + " 天　累计 " + totalDays(h) + " 天", 120, 490);
  var cols = 10, size = 76, gap = 12, gx = 120, gy = 560, startDay = info.len ? info.start : t;
  for (var i = 0; i < h.days; i++){
    var cx = gx + (i % cols) * (size + gap) + size/2, cy = gy + Math.floor(i / cols) * (size + gap) + size/2, e = h.log[startDay + i];
    x.beginPath(); x.arc(cx, cy, size/2 - 4, 0, Math.PI*2);
    if (e){ x.fillStyle = e.t === "card" ? "#FBF1DC" : "#FBE9E6"; x.fill(); x.lineWidth = 5; x.strokeStyle = e.t === "card" ? "#B8872A" : "#C8372D"; x.stroke(); }
    else { x.setLineDash([6, 6]); x.lineWidth = 2; x.strokeStyle = "#B7C6BC"; x.stroke(); x.setLineDash([]); }
    x.fillStyle = e ? (e.t === "card" ? "#B8872A" : "#C8372D") : "#9DB0A5"; x.font = (e ? "bold " : "") + "26px " + serif; x.textAlign = "center"; x.fillText(e && e.t === "card" ? "补" : String(i + 1), cx, cy + 9); x.textAlign = "left";
  }
  x.fillStyle = "#56685E"; x.font = "34px " + sans; x.fillText(h.pledge ? "“" + h.pledge + "”" : "", 120, H - 130);
  c.toBlob(function(b){ if (b) download("打卡进度-" + h.name + "-第" + p + "天.png", "image/png", b); else toast("生成图片失败"); }, "image/png");
}
function roundRect(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function exportCode(){ try { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch(e){ return ""; } }
function csvText(){
  var rows = [["日期","项目","类型","备注"]];
  S.habits.forEach(function(h){ Object.keys(h.log).map(Number).sort().forEach(function(n){ var d = dayDate(n), e = h.log[n]; rows.push([d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()), h.name, e.t === "card" ? "补签" : "打卡", e.note || ""]); }); });
  return "\ufeff" + rows.map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
}

/* ---------- 操作 ---------- */
function byId(id){ for (var i = 0; i < S.habits.length; i++) if (S.habits[i].id === id) return S.habits[i]; return null; }
var ACT = {
  home: function(){ renderHome(); },
  help: renderHelp,
  settings: renderSettings,
  hideWelcome: function(){ S.welcome = false; save(); renderHome(); },
  detail: function(b){ renderDetail(b.getAttribute("data-id")); },
  backDetail: function(){ if (editing && !editing.isNew) renderDetail(editing.h.id); else renderHome(); },
  check: function(b){
    var h = byId(b.getAttribute("data-id")), t = today(); if (!h || logged(h, t)) return;
    h.log[t] = {t:"done", at:Date.now()};
    if (h.link === "quest" && questDoneToday()) h.log[t].note = "完成闯关每日任务";
    var ev = evaluate(h); save(); chime(false);
    noteOpen[h.id] = !h.log[t].note;
    renderHome(h.id);
    if (ev.length) setTimeout(function(){ celebrate(h, ev); }, 450);
  },
  undo: function(b){ var h = byId(b.getAttribute("data-id")); if (!h) return; delete h.log[today()]; save(); renderHome(); toast("已撤销今天的打卡"); },
  noteToggle: function(b){ var id = b.getAttribute("data-id"); noteOpen[id] = !noteOpen[id]; renderHome(); var el = $("#note-" + id); if (el) el.focus(); },
  noteSave: function(b){ var id = b.getAttribute("data-id"), h = byId(id), el = $("#note-" + id); if (!h || !el) return; h.log[today()].note = el.value.trim(); noteOpen[id] = false; save(); renderHome(); },
  fill: function(b){
    var h = byId(b.getAttribute("data-id")); if (!h) return;
    var miss = missingFillable(h); if (h.cards < miss.length) return;
    miss.forEach(function(n){ h.log[n] = {t:"card", at:Date.now()}; h.cards--; });
    var ev = evaluate(h); save(); renderHome(); toast("补签成功，连续天数保住了");
    if (ev.length) setTimeout(function(){ celebrate(h, ev); }, 300);
  },
  add: function(){ renderEdit(newHabit(TEMPLATES[4]), true); },
  edit: function(b){ var h = byId(b.getAttribute("data-id")); if (h) renderEdit(JSON.parse(JSON.stringify(h)), false); },
  tpl: function(b){ var tp = TEMPLATES[+b.getAttribute("data-k")]; var h = newHabit(tp); renderEdit(h, true); },
  emo: function(b){ editing.emoji = b.getAttribute("data-v"); document.querySelectorAll(".emo-pick button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); },
  saveEdit: function(){
    var h = editing.h, name = $("#f-name").value.trim();
    if (!name){ toast("请填写名称"); $("#f-name").focus(); return; }
    var days = +$("#f-days").value, typed = readRewardInputs();
    h.name = name; h.emoji = editing.emoji; h.target = $("#f-target").value.trim(); h.remind = $("#f-remind").value || "21:00";
    h.fund = Math.max(0, +$("#f-fund").value || 0); h.unit = $("#f-unit").value.trim() || "元"; h.pledge = $("#f-pledge").value.trim();
    h.link = $("#f-link").checked ? "quest" : "";
    var gotMap = {}; (h.rewards || []).forEach(function(r){ gotMap[r.d] = r.got; });
    h.rewards = rewardsFor(days, typed.map(function(r){ return {d:r.d, t:r.t, got:!!gotMap[r.d]}; }));
    h.days = days;
    if (editing.isNew){ S.habits.push(h); }
    else { for (var i = 0; i < S.habits.length; i++) if (S.habits[i].id === h.id) S.habits[i] = h; }
    evaluate(h); save(); toast("已保存");
    if (editing.isNew) renderHome(); else renderDetail(h.id);
  },
  got: function(b){ var h = byId(cur), r = h.rewards[+b.getAttribute("data-k")]; r.got = !r.got; save(); renderDetail(cur); },
  newRound: function(){
    var h = byId(cur); if (!h || !h.completed) return;
    h.history = h.history || []; h.history.push({round:h.round, days:h.days, end:h.completed, fund:fundOf(h)});
    h.round++; h.start = today(); h.completed = null; h.unlocked = {}; h.cardKeys = {}; h.cards = Math.max(h.cards, 1);
    h.rewards.forEach(function(r){ r.got = false; });
    save(); toast("第 " + h.round + " 轮开始了"); renderDetail(h.id);
  },
  remove: function(){ var h = byId(cur); if (h && confirm("确定删除“" + h.name + "”和它的全部记录吗？")){ S.habits = S.habits.filter(function(x){ return x !== h; }); save(); renderHome(); } },
  ics: function(){ var h = byId(cur); if (h){ download("打卡提醒-" + h.name + ".ics", "text/calendar;charset=utf-8", icsText(h)); toast("已生成日历文件，打开后选“添加”"); } },
  share: function(){ var h = byId(cur); if (h) shareImage(h); },
  closeModal: function(){ $("#modal").hidden = true; },
  theme: function(b){ S.settings.theme = b.getAttribute("data-v"); save(); applyTheme(); renderSettings(); },
  sound: function(b){ S.settings.sound = b.getAttribute("data-v") === "1"; save(); renderSettings(); },
  copy: function(){
    var box = $("#exp");
    function fb(){ box.focus(); box.select(); try { document.execCommand("copy"); toast("已复制"); } catch(e){ toast("请长按文本框手动复制"); } }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(function(){ toast("已复制"); }, fb); else fb();
  },
  "import": function(){
    var v = $("#imp").value.trim(); if (!v) return;
    try { var o = JSON.parse(decodeURIComponent(escape(atob(v)))); if (!o || !Array.isArray(o.habits)) throw 0; S = o; S.settings = S.settings || {theme:"auto", sound:true}; save(); applyTheme(); toast("记录已恢复"); renderHome(); }
    catch(e){ toast("备份码无法识别，请检查是否复制完整"); }
  },
  csv: function(){ download("打卡记录.csv", "text/csv;charset=utf-8", csvText()); },
  wipe: function(){ if (confirm("确定清空全部项目和记录吗？这一步无法撤销。")){ S = fresh(); S.welcome = true; save(); applyTheme(); renderHome(); } }
};
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var f = ACT[b.getAttribute("data-act")]; if (f) f(b, e);
});
document.addEventListener("change", function(e){
  if (e.target && e.target.id === "f-days") $("#f-rewards").innerHTML = rewardRows(rewardsFor(+e.target.value, readRewardInputs()));
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !$("#modal").hidden) ACT.closeModal(); });
document.addEventListener("visibilitychange", function(){ if (!document.hidden && !$("#v-home").hidden) renderHome(); });

applyTheme();
S.habits.forEach(function(h){ evaluate(h); });
save();
renderHome();
syncFromIdb(function(o){ S = o; S.settings = S.settings || {theme:"auto", sound:true}; S.habits.forEach(function(h){ evaluate(h); }); }, function(adopted){
  if (adopted){ applyTheme(); renderHome(); toast("已从数据库备份恢复记录"); }
  else if (!$("#v-home").hidden) renderHome();
});
if (/^https?:$/.test(location.protocol)){
  try {
    var lm = document.createElement("link"); lm.rel = "manifest"; lm.href = "manifest-checkin.webmanifest"; document.head.appendChild(lm);
    var li = document.createElement("link"); li.rel = "apple-touch-icon"; li.href = "icon-checkin-180.png"; document.head.appendChild(li);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
  } catch(e){}
}
})();
</script>
